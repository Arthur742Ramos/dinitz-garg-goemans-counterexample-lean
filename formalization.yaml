# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Lean formalization of the Dinitz--Garg--Goemans cost counterexample"
  description: >-
    A standalone Lean 4 and Mathlib formalization of the finite counterexample
    to the cost-preserving single-source unsplittable-flow conjecture. The
    development realizes a directed graph with seven vertices, nine arcs, and
    three terminal demands; checks a feasible rational fractional flow of cost
    58 with maximum demand 15; and proves that every unsplittable routing under
    the weak additive congestion bound has cost at least 60. It also derives
    the failure of the strict congestion variant. No general algorithmic or
    complexity-theoretic claim is made.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy Jose Guerra Barretto de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["cs.DS", "math.LO"]
  msc2020: ["68R10", "90C27", "03B35"]

sources:
  - title: "A Formal Counterexample to the Cost-Preserving Single-Source Unsplittable Flow Conjecture"
    authors:
      - "Arthur Freitas Ramos"
      - "David Barros Hulak"
      - "Ruy Jose Guerra Barretto de Queiroz"
    id: "https://isa-afp.org/entries/Dinitz_Garg_Goemans_Counterexample.html"
    type: "formalization"
    location: "https://isa-afp.org/entries/Dinitz_Garg_Goemans_Counterexample.html"
    relationship: "independently-proves"
    note: "This Lean development is a standalone reimplementation of the finite certificate in the Isabelle/AFP entry; it does not import Isabelle source or claim a new mathematical counterexample."
  - title: "On the Single-Source Unsplittable Flow Problem"
    authors:
      - "Yefim Dinitz"
      - "Naveen Garg"
      - "Michel X. Goemans"
    id: "https://doi.org/10.1007/s004930050043"
    type: "paper"
    location: "Combinatorica 19(1), 17--41 (1999)"
    relationship: "background"
    note: "The source paper establishes the additive-congestion rounding result and formulates the cost-preservation question addressed by the counterexample."
  - title: "Counterexample to the Dinitz--Garg--Goemans Cost Conjecture"
    authors:
      - "Dmitry Rybin"
    id: "https://x.com/DmitryRybin1"
    type: "web post"
    location: "https://x.com/DmitryRybin1"
    relationship: "background"
    note: "Announcement of the finite counterexample on July 22, 2026."
  - title: "Single-Source Unsplittable Flows in Planar and Bounded-Genus Graphs"
    authors:
      - "Vera Traub"
      - "Laura Vargas Koch"
      - "Rico Zenklusen"
    id: "https://doi.org/10.1007/s10107-026-02365-x"
    type: "paper"
    location: "Mathematical Programming (2026)"
    relationship: "background"
    note: "Related current literature listed by the AFP source entry."

related_formalizations:
  - id: "https://isa-afp.org/entries/Dinitz_Garg_Goemans_Counterexample.html"
    relationship: "independent"
    note: "The Isabelle/HOL AFP entry formalizes the same finite certificate; this repository provides a separate Lean/Mathlib development."

status:
  scope: >-
    The formalization defines a finite path-flow model over rational numbers,
    encodes the seven-vertex directed instance and its two routes per
    commodity, proves that the displayed routes are exactly all source-to-
    terminal paths, verifies feasibility and cost 58 of the fractional flow,
    and proves the lower bound 60 for every weakly bounded unsplittable
    routing. It proves both weak and strict conjecture-negation corollaries.
    It does not formalize the general Dinitz--Garg--Goemans rounding theorem,
    an algorithm, a complexity classification, or the Isabelle implementation.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "DinitzGargGoemans.dggCounterexampleWitness"
    - "DinitzGargGoemans.weakDggCostConjectureFalse"
    - "DinitzGargGoemans.strictDggCostConjectureFalse"

automation:
  methods:
    - method: "agent"
      models: ["GPT-5"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Proof engineering with simp, norm_num, linarith, ring, exact finite case analysis, and the pinned Lean/Mathlib toolchain."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local macOS workstation"
      prompting_notes: "Port the published finite Isabelle certificate into an independently checked Lean statement/proof split while preserving source attribution and the rational-versus-real scope distinction."
  spend_usd: "subscription-based"
  notes: "The development was prepared with agent assistance and checked by Lean; Comparator and NanoDa are used for the Palomar statement, proof, and axiom audit."

fidelity:
  divergences: >-
    The Isabelle source uses a generic model with real-valued data, while this
    Lean certificate uses exact rational arithmetic. Since every displayed
    datum and inequality is rational, the finite certificate embeds into the
    real-valued model. The Lean project reimplements the certificate rather
    than importing Isabelle code, and it does not formalize the general
    rounding theorem or any algorithmic/complexity claims.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "The proof builds with Lean 4.33.0 and pinned Mathlib. The theorem surface, source attribution, exact numerical certificate, and rational scope were audited locally; no external peer review is claimed."

alignment:
  namespace: "DinitzGargGoemans"
  statements:
    - source: "All source-to-terminal paths in the seven-vertex graph"
      lean: "DinitzGargGoemans.allSourceTerminalPaths"
      module: "DinitzGargGoemans.Proof"
      status: "proved"
      note: "Every path from the source to a commodity terminal is exactly its paid or free route."
    - source: "Feasible fractional witness"
      lean: "DinitzGargGoemans.splitFlowFeasible"
      module: "DinitzGargGoemans.Proof"
      status: "proved"
      note: "The six route fractions meet all demands and capacity constraints."
    - source: "Fractional witness cost"
      lean: "DinitzGargGoemans.fractionalCostValue"
      module: "DinitzGargGoemans.Proof"
      status: "proved"
      note: "The fractional routing has exact cost 58."
    - source: "Unsplittable cost lower bound"
      lean: "DinitzGargGoemans.boundedUnsplittableCost"
      module: "DinitzGargGoemans.Proof"
      status: "proved"
      note: "The weak additive congestion bound forces at least two paid routes, hence cost at least 60."
    - source: "Finite counterexample witness"
      lean: "DinitzGargGoemans.dggCounterexampleWitness"
      module: "DinitzGargGoemans.Proof"
      status: "proved"
      note: "Combines well-formedness, fractional feasibility, and failure of cost-preserving weak rounding."
    - source: "Weak cost-preservation conjecture"
      lean: "DinitzGargGoemans.weakDggCostConjectureFalse"
      module: "DinitzGargGoemans.Proof"
      status: "proved"
      note: "The universal weak cost-preservation property is refuted by the concrete instance."
    - source: "Strict cost-preservation variant"
      lean: "DinitzGargGoemans.strictDggCostConjectureFalse"
      module: "DinitzGargGoemans.Proof"
      status: "proved"
      note: "Strict congestion rounding implies weak rounding, so the strict universal property is also false."

acknowledgements: "Lean and Mathlib; Yefim Dinitz, Naveen Garg, and Michel X. Goemans for the original single-source unsplittable-flow result and cost question; Dmitry Rybin for the announced finite counterexample; Arthur Freitas Ramos, David Barros Hulak, and Ruy Jose Guerra Barretto de Queiroz for the Isabelle/AFP formalization; and the Archive of Formal Proofs for the source entry."
